server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;

    # The client calls bare /api paths, which only the Vite dev proxy resolves. nginx plays that
    # role in the built image, so the browser still sees a single origin and the API needs no CORS
    # configuration.
    location /api/ {
        proxy_pass http://api:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # A single-page app owns its own routing, so any unknown path must return index.html rather
    # than a 404.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
