<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="huntpilot">
  <title>huntpilot</title>
  <!--
    A radar sweep, and the one thing the product actually reports: what moved between passes.
    The three blips are the three answers a sweep can give about a posting. Garden is a role
    still listed, raspberry is one that has gone, and sage is one not yet judged — the same
    three colours those states carry everywhere else in the product, so the mark says what the
    tool does rather than merely looking like radar.

    The rings stay currentColor so the mark takes the ink of whatever it sits in, which is what
    lets one file serve the dashboard header and the landing page without a second copy.
  -->
  <defs>
    <linearGradient id="sweep" x1="32" y1="32" x2="60" y2="12" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#2f7d4f" stop-opacity="0.85"/>
      <stop offset="1" stop-color="#2f7d4f" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <circle cx="32" cy="32" r="27" fill="none" stroke="currentColor" stroke-opacity="0.28" stroke-width="3"/>
  <circle cx="32" cy="32" r="15.5" fill="none" stroke="currentColor" stroke-opacity="0.18" stroke-width="3"/>

  <path d="M32 32 L32 5 A27 27 0 0 1 55.4 18.5 Z" fill="url(#sweep)"/>
  <path d="M32 32 L55.4 18.5" stroke="#2f7d4f" stroke-width="3.5" stroke-linecap="round"/>

  <circle cx="44" cy="24" r="4.5" fill="#2f7d4f"/>
  <circle cx="41" cy="45" r="2.8" fill="#9e2b3f"/>
  <circle cx="20" cy="42" r="2.6" fill="#8fb98c"/>
</svg>
