[project]
name = "huntpilot-api"
version = "0.1.0"
description = "huntpilot API — owns the database"
requires-python = ">=3.12"
dependencies = [
    "beanie>=1.27",
    "celery>=5.5.3",
    "fastapi>=0.141.1",
    "httpx>=0.28.1",
    "pydantic-settings>=2.14.2",
    "redis>=6.4.0",
    "uvicorn[standard]>=0.52.1",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "ruff>=0.8",
    "mypy>=1.13",
    "pytest-asyncio>=1.4.0",
]

[tool.uv]
package = false

[tool.mypy]
python_version = "3.12"
strict = true

# Celery ships no py.typed marker and there are no stubs for it, so strict mode would refuse the
# import outright. Scoped to celery alone rather than relaxed globally.
[[tool.mypy.overrides]]
module = ["celery.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
# Without "auto" every async test needs an explicit @pytest.mark.asyncio or it fails outright.
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "D"]

[tool.ruff.lint.pydocstyle]
convention = "google"
