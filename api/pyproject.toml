[project]
name = "huntpilot-api"
version = "0.1.0"
description = "huntpilot API — owns the database"
requires-python = ">=3.12"
dependencies = [
    "beanie>=1.27",
    "fastapi>=0.141.1",
    "pydantic-settings>=2.14.2",
    "uvicorn[standard]>=0.52.1",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "ruff>=0.8",
    "mypy>=1.13",
]

[tool.uv]
package = false

[tool.mypy]
python_version = "3.12"
strict = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "D"]

[tool.ruff.lint.pydocstyle]
convention = "google"
