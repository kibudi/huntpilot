<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 520" width="1200" height="520" role="img" aria-labelledby="arch-title arch-desc">
  <title id="arch-title">huntpilot architecture</title>
  <desc id="arch-desc">The React dashboard calls the FastAPI service over HTTP, and the API owns MongoDB through Beanie. Beat enqueues a sweep on Redis every six hours; a Celery worker consumes it, reads three public job board APIs over HTTPS, and writes back to the same MongoDB directly rather than through the API. The stored search profile is what the worker filters with.</desc>

  <!--
    Drawn at the same width and type weight as funnel.svg so the two figures read as one set when
    the README stacks them. An earlier version was half this scale, which left the diagram looking
    like a footnote beside the screenshots.

    Garden green is spent only on the two boxes the project owns outright — the API and the
    database it is the sole writer of — and on the two edges that leave the process. Everything
    else is sage. An earlier pass drew every stroke the same green, which made the diagram one flat
    weight and said nothing about where the writes happen.

    The worker-to-database edge is drawn as its own arrow rather than routed through the API
    because that is the fact most readers get wrong: the worker is the same package run under a
    different command, not a client of the HTTP service.
  -->

  <defs>
    <style>
      .sans  { font-family: ui-sans-serif, system-ui, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
      .mono  { font-family: ui-monospace, "Cascadia Mono", "SF Mono", Menlo, monospace; }
      .box   { fill: #fdfbf2; stroke: #cddcc6; stroke-width: 1.6; }
      .owned { fill: #fdfbf2; stroke: #2f7d4f; stroke-width: 2.6; }
      .ghost { fill: #eae6d4; stroke: #8fb98c; stroke-width: 1.6; stroke-dasharray: 7 5; }
      .name  { font-size: 24px; font-weight: 600; fill: #1c3a30; }
      .sub   { font-size: 16px; fill: #456347; }
      .edge  { font-size: 15px; fill: #456347; }
      .flow  { stroke: #8fb98c; stroke-width: 1.8; fill: none; }
      .out   { stroke: #2f7d4f; stroke-width: 2.4; fill: none; }
    </style>

    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0 L10 5 L0 10 z" fill="#8fb98c"/>
    </marker>
    <marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0 L10 5 L0 10 z" fill="#2f7d4f"/>
    </marker>
  </defs>

  <rect width="1200" height="520" fill="#f4f1e4"/>

  <rect class="box" x="60" y="60" width="320" height="88" rx="12"/>
  <text class="sans name" x="88" y="96">dashboard</text>
  <text class="sans sub"  x="88" y="120">React 19 &#183; TypeScript &#183; Tailwind v4</text>
  <text class="sans sub"  x="88" y="140">served by nginx, which proxies /api</text>

  <rect class="owned" x="60" y="216" width="320" height="88" rx="12"/>
  <text class="sans name" x="88" y="252">api</text>
  <text class="sans sub"  x="88" y="276">FastAPI</text>
  <text class="sans sub"  x="88" y="296">the only service that serves clients</text>

  <rect class="owned" x="60" y="372" width="320" height="88" rx="12"/>
  <text class="sans name" x="88" y="408">MongoDB Atlas</text>
  <text class="sans sub"  x="88" y="432">Beanie ODM &#183; no migrations layer</text>
  <text class="sans sub"  x="88" y="452">one document per posting, for life</text>

  <rect class="box" x="440" y="60" width="320" height="88" rx="12"/>
  <text class="sans name" x="468" y="96">beat</text>
  <text class="sans sub"  x="468" y="120">enqueues one sweep every six hours</text>
  <text class="sans sub"  x="468" y="140">its own service, so it fires once</text>

  <rect class="box" x="440" y="216" width="320" height="88" rx="12"/>
  <text class="sans name" x="468" y="252">redis 7</text>
  <text class="sans sub"  x="468" y="276">the Celery broker</text>
  <text class="sans sub"  x="468" y="296">no port published to the host</text>

  <rect class="box" x="440" y="372" width="320" height="88" rx="12"/>
  <text class="sans name" x="468" y="408">worker</text>
  <text class="sans sub"  x="468" y="432">Celery &#183; the api package, run</text>
  <text class="sans sub"  x="468" y="452">under a different command</text>

  <rect class="box" x="820" y="60" width="320" height="88" rx="12"/>
  <text class="sans mono name" x="848" y="96" font-size="22">profile.json</text>
  <text class="sans sub"       x="848" y="120">seeds the stored search once;</text>
  <text class="sans sub"       x="848" y="140">the dashboard edits it from then on</text>

  <rect class="ghost" x="820" y="372" width="320" height="88" rx="12"/>
  <text class="sans name" x="848" y="408">job boards</text>
  <text class="sans sub"  x="848" y="432">Greenhouse &#183; Lever &#183; Ashby</text>
  <text class="sans sub"  x="848" y="452">public JSON, no key, no scraping</text>

  <path class="flow" d="M220 152 L220 210" marker-end="url(#a)"/>
  <text class="sans edge" x="232" y="186">HTTP</text>

  <path class="flow" d="M220 308 L220 366" marker-end="url(#a)"/>
  <text class="sans edge" x="232" y="342">Beanie</text>

  <path class="flow" d="M600 152 L600 210" marker-end="url(#a)"/>
  <text class="sans edge" x="612" y="186">enqueue</text>

  <path class="flow" d="M600 308 L600 366" marker-end="url(#a)"/>
  <text class="sans edge" x="612" y="342">consume</text>

  <path class="out" d="M764 416 L814 416" marker-end="url(#ag)"/>
  <text class="sans edge" x="770" y="400">HTTPS</text>

  <path class="out" d="M436 416 L386 416" marker-end="url(#ag)"/>
  <text class="sans edge" x="392" y="400">writes</text>

  <path class="flow" d="M900 152 C900 260, 700 280, 640 366" marker-end="url(#a)"/>
  <text class="sans edge" x="782" y="268">what to filter for</text>
</svg>
