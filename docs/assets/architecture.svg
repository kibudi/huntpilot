<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 340" role="img" aria-labelledby="arch-title arch-desc">
  <title id="arch-title">huntpilot architecture</title>
  <desc id="arch-desc">The React dashboard calls the FastAPI service, which owns MongoDB. A Celery worker, scheduled by Beat through Redis, reads three public job board APIs and writes to the same database.</desc>

  <style>
    .box { fill: #fdfbf2; stroke: #2f7d4f; stroke-width: 1.5; }
    .ghost { fill: #eae6d4; stroke: #cddcc6; stroke-width: 1.5; stroke-dasharray: 5 4; }
    .lbl { fill: #1c3a30; font: 600 15px ui-sans-serif, system-ui, "Segoe UI", sans-serif; }
    .sub { fill: #3d6353; font: 12px ui-monospace, "SF Mono", Menlo, monospace; }
    .edge { fill: #2b7e7d; font: 11px ui-monospace, "SF Mono", Menlo, monospace; }
    .flow { stroke: #2f7d4f; stroke-width: 1.6; fill: none; marker-end: url(#arrow); }
    .flow-accent { stroke: #2f7d4f; stroke-width: 2.2; fill: none; marker-end: url(#arrow-accent); }
  </style>

  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0 0 L10 5 L0 10 z" fill="#2f7d4f"/>
    </marker>
    <marker id="arrow-accent" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0 0 L10 5 L0 10 z" fill="#2f7d4f"/>
    </marker>
  </defs>

  <!-- browser -->
  <rect class="box" x="30" y="24" width="190" height="60" rx="10"/>
  <text class="lbl" x="50" y="50">dashboard</text>
  <text class="sub" x="50" y="69">React · TypeScript</text>

  <!-- api -->
  <rect class="box" x="30" y="140" width="190" height="60" rx="10"/>
  <text class="lbl" x="50" y="166">api</text>
  <text class="sub" x="50" y="185">FastAPI</text>

  <!-- database -->
  <rect class="box" x="30" y="256" width="190" height="60" rx="10"/>
  <text class="lbl" x="50" y="282">MongoDB</text>
  <text class="sub" x="50" y="301">Beanie ODM</text>

  <!-- beat -->
  <rect class="box" x="345" y="24" width="180" height="60" rx="10"/>
  <text class="lbl" x="365" y="50">beat</text>
  <text class="sub" x="365" y="69">every 6 hours</text>

  <!-- redis -->
  <rect class="box" x="345" y="140" width="180" height="60" rx="10"/>
  <text class="lbl" x="365" y="166">redis</text>
  <text class="sub" x="365" y="185">the queue</text>

  <!-- worker -->
  <rect class="box" x="345" y="256" width="180" height="60" rx="10"/>
  <text class="lbl" x="365" y="282">worker</text>
  <text class="sub" x="365" y="301">Celery · one sweep</text>

  <!-- boards -->
  <rect class="ghost" x="650" y="256" width="200" height="60" rx="10"/>
  <text class="lbl" x="670" y="282">job boards</text>
  <text class="sub" x="670" y="301">Greenhouse · Lever</text>
  <text class="sub" x="670" y="317">Ashby</text>

  <!-- profile -->
  <rect class="ghost" x="650" y="140" width="200" height="60" rx="10"/>
  <text class="lbl" x="670" y="166">profile.json</text>
  <text class="sub" x="670" y="185">what to look for</text>

  <!-- flows -->
  <path class="flow" d="M125 86 L125 136"/>
  <text class="edge" x="134" y="115">HTTP</text>

  <path class="flow" d="M125 202 L125 252"/>
  <text class="edge" x="134" y="231">Beanie</text>

  <path class="flow" d="M435 86 L435 136"/>
  <path class="flow" d="M435 202 L435 252"/>
  <text class="edge" x="444" y="231">consume</text>

  <path class="flow-accent" d="M648 286 L529 286"/>
  <text class="edge" x="546" y="277">HTTPS</text>

  <path class="flow" d="M648 176 L529 210 L470 250"/>

  <path class="flow-accent" d="M341 286 L226 286"/>
  <text class="edge" x="243" y="277">writes</text>
</svg>
