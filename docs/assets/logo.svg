<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="huntpilot">
  <title>huntpilot</title>
  <!-- A radar sweep: the product reads a board, again, and reports what moved between passes. -->
  <defs>
    <linearGradient id="sweep" x1="32" y1="32" x2="60" y2="12" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#ee964b" stop-opacity="0.85"/>
      <stop offset="1" stop-color="#ee964b" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <circle cx="32" cy="32" r="27" fill="none" stroke="currentColor" stroke-opacity="0.28" stroke-width="3"/>
  <circle cx="32" cy="32" r="15.5" fill="none" stroke="currentColor" stroke-opacity="0.18" stroke-width="3"/>

  <path d="M32 32 L32 5 A27 27 0 0 1 55.4 18.5 Z" fill="url(#sweep)"/>
  <path d="M32 32 L55.4 18.5" stroke="#ee964b" stroke-width="3.5" stroke-linecap="round"/>

  <circle cx="44" cy="24" r="4.5" fill="#ee964b"/>
  <circle cx="20" cy="42" r="2.6" fill="currentColor" fill-opacity="0.35"/>
  <circle cx="41" cy="45" r="2.6" fill="currentColor" fill-opacity="0.35"/>
</svg>
