# Starts the whole app with `docker compose up`.
#
# MONGODB_URI and MONGODB_DB come from the repo-root .env, which is gitignored. Values are passed
# as environment variables rather than the file being copied into the image, so a built image
# carries no credentials.
services:
  api:
    build: ./api
    environment:
      MONGODB_URI: ${MONGODB_URI:?set MONGODB_URI in .env}
      MONGODB_DB: ${MONGODB_DB:-huntpilot}
    ports:
      - "8000:8000"
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request;urllib.request.urlopen('http://127.0.0.1:8000/health')",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  web:
    build: ./web
    ports:
      - "5173:80"
    # nginx proxies /api to the api service, so it must be answering before the browser can load
    # anything useful.
    depends_on:
      api:
        condition: service_healthy

  # Celery's broker. No port is published: only the worker and beat talk to it, and exposing it
  # would put an unauthenticated Redis on the host.
  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  # The worker and beat run the ./api image with a different command rather than an image of their
  # own. There is one task and it lives in the api package, so a second tree would duplicate that
  # package and its dependencies to add nothing.
  worker:
    build: ./api
    command: ["celery", "-A", "app.worker.celery_app", "worker", "--loglevel=info"]
    environment:
      MONGODB_URI: ${MONGODB_URI:?set MONGODB_URI in .env}
      MONGODB_DB: ${MONGODB_DB:-huntpilot}
      REDIS_URL: redis://redis:6379/0
    depends_on:
      redis:
        condition: service_healthy

  # Beat only enqueues; the worker does the sweeping. It is a separate service because an embedded
  # scheduler fires once per worker, so scheduling would double the moment a second worker starts.
  beat:
    build: ./api
    command: ["celery", "-A", "app.worker.celery_app", "beat", "--loglevel=info"]
    # Beat never opens the database — it only enqueues — but it imports the same settings object,
    # which has no default for MONGODB_URI and so refuses to load without it.
    environment:
      MONGODB_URI: ${MONGODB_URI:?set MONGODB_URI in .env}
      MONGODB_DB: ${MONGODB_DB:-huntpilot}
      REDIS_URL: redis://redis:6379/0
    depends_on:
      redis:
        condition: service_healthy

  # Scheduling and delivery for alerts, kept out of the application.
  #
  # The split is deliberate: the API decides what is true — which applications have gone quiet,
  # which postings are new — and n8n only decides when to ask and where to send the answer. Putting
  # the "14 days without a reply" rule in a workflow node would be a second copy of business logic
  # living somewhere untested, which is the same reason the dashboard does no filtering.
  #
  # It reaches the API at http://api:8000 over the compose network, so nothing is exposed to the
  # internet and no credential leaves this machine. Self-hosted n8n is free; this adds no cost.
  #
  # N8N_SECURE_COOKIE is off because the editor is served over plain http on localhost, and n8n
  # otherwise refuses to set its session cookie and shows a blank login.
  n8n:
    image: docker.n8n.io/n8nio/n8n
    ports:
      - "5678:5678"
    environment:
      N8N_SECURE_COOKIE: "false"
      N8N_RUNNERS_ENABLED: "true"
      GENERIC_TIMEZONE: Asia/Jerusalem
      TZ: Asia/Jerusalem
      HUNTPILOT_API: http://api:8000
    volumes:
      - n8n_data:/home/node/.n8n
    depends_on:
      api:
        condition: service_healthy

# Workflows and credentials live here rather than in the image, so `docker compose down` does not
# delete them. Removing this volume loses every workflow built in the editor.
volumes:
  n8n_data:
