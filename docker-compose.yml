# Starts the whole app with `docker compose up`.
#
# MONGODB_URI and MONGODB_DB come from the repo-root .env, which is gitignored. Values are passed
# as environment variables rather than the file being copied into the image, so a built image
# carries no credentials.
services:
  api:
    build: ./api
    environment:
      MONGODB_URI: ${MONGODB_URI:?set MONGODB_URI in .env}
      MONGODB_DB: ${MONGODB_DB:-huntpilot}
    ports:
      - "8000:8000"
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request;urllib.request.urlopen('http://127.0.0.1:8000/health')",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  web:
    build: ./web
    ports:
      - "5173:80"
    # nginx proxies /api to the api service, so it must be answering before the browser can load
    # anything useful.
    depends_on:
      api:
        condition: service_healthy

  # Celery's broker. No port is published: only the worker and beat talk to it, and exposing it
  # would put an unauthenticated Redis on the host.
  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  # The worker and beat run the ./api image with a different command rather than an image of their
  # own. There is one task and it lives in the api package, so a second tree would duplicate that
  # package and its dependencies to add nothing.
  worker:
    build: ./api
    command: ["celery", "-A", "app.worker.celery_app", "worker", "--loglevel=info"]
    environment:
      MONGODB_URI: ${MONGODB_URI:?set MONGODB_URI in .env}
      MONGODB_DB: ${MONGODB_DB:-huntpilot}
      REDIS_URL: redis://redis:6379/0
    depends_on:
      redis:
        condition: service_healthy

  # Beat only enqueues; the worker does the sweeping. It is a separate service because an embedded
  # scheduler fires once per worker, so scheduling would double the moment a second worker starts.
  beat:
    build: ./api
    command: ["celery", "-A", "app.worker.celery_app", "beat", "--loglevel=info"]
    # Beat never opens the database — it only enqueues — but it imports the same settings object,
    # which has no default for MONGODB_URI and so refuses to load without it.
    environment:
      MONGODB_URI: ${MONGODB_URI:?set MONGODB_URI in .env}
      MONGODB_DB: ${MONGODB_DB:-huntpilot}
      REDIS_URL: redis://redis:6379/0
    depends_on:
      redis:
        condition: service_healthy
